<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Redesign Concepts Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #05070a;
      color: #f1f5f9;
      font-family: 'Manrope', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    /* Top Bar Navigation */
    header {
      background: #0d1117;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      font-weight: 800;
      font-size: 1rem;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .brand span { color: #94a3b8; font-weight: 500; font-size: 0.85rem; }

    .tabs {
      display: flex;
      gap: 0.5rem;
      background: #161b22;
      padding: 0.3rem;
      border-radius: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-family: 'Manrope', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn:hover { color: #f1f5f9; }
    .tab-btn.active {
      background: #38bdf8;
      color: #040914;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }

    .open-btn {
      background: rgba(52, 211, 153, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.3);
      color: #34d399;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 0.45rem 0.9rem;
      border-radius: 0.5rem;
      text-decoration: none;
      transition: all 0.2s;
    }
    .open-btn:hover { background: rgba(52, 211, 153, 0.25); }

    /* Main iframe preview */
    iframe {
      flex: 1;
      width: 100%;
      height: calc(100vh - 60px);
      border: none;
      background: #07090e;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      CHOCKALINGAM <span>/// Portfolio Concept Showcase</span>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchConcept('concept1_ops_center.html', this)">
        1. Live Ops Center
      </button>
      <button class="tab-btn" onclick="switchConcept('concept2_swiss_monograph.html', this)">
        2. Swiss Monograph
      </button>
      <button class="tab-btn" onclick="switchConcept('concept3_ai_copilot.html', this)">
        3. AI Co-Pilot
      </button>
    </div>

    <a id="externalLink" href="concept1_ops_center.html" target="_blank" class="open-btn">
      Open Full Page ↗
    </a>
  </header>

  <iframe id="previewFrame" src="concept1_ops_center.html"></iframe>

  <script>
    function switchConcept(url, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('previewFrame').src = url;
      document.getElementById('externalLink').href = url;
    }
  </script>
</body>
</html>
